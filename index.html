<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12 Bulan + Kalender Harian - Tap Rp50K</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            padding: 20px;
            color: white;
        }

        .container {
            max-width: 450px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.2);
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }

        .header {
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding: 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .bulan-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 25px;
        }

        .bulan-card {
            background: linear-gradient(145deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05));
            border-radius: 20px;
            padding: 25px 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .bulan-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .bulan-card:hover::before {
            left: 100%;
        }

        .bulan-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(255,255,255,0.5);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .bulan-card.aktif {
            background: linear-gradient(145deg, #11998e, #38ef7d);
            transform: scale(1.05);
            border-color: #38ef7d;
            box-shadow: 0 20px 40px rgba(56,239,125,0.4);
        }

        .nama-bulan {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .hari-display {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .gaji-display {
            font-size: 20px;
            font-weight: 600;
            opacity: 0.95;
        }

        /* KALENDER MODAL */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .kalender-modal {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(25px);
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 30px;
            max-width: 90vw;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            transform: scale(0.7);
            animation: modalPop 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes modalPop {
            to {
                transform: scale(1);
            }
        }

        .modal-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 25px;
            background: rgba(255,255,255,0.2);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: #ff6b6b;
            transform: scale(1.1);
        }

        .kalender-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-top: 20px;
        }

        .hari-nama {
            font-weight: bold;
            padding: 12px 4px;
            text-align: center;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            font-size: 14px;
        }

        .hari-tanggal {
            aspect-ratio: 1;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255,255,255,0.1);
            position: relative;
        }

        .hari-tanggal:hover {
            transform: scale(1.1);
            border-color: #38ef7d;
            background: rgba(56,239,125,0.2);
            box-shadow: 0 8px 20px rgba(56,239,125,0.3);
        }

        .hari-tanggal.kerja {
            background: linear-gradient(145deg, #11998e, #38ef7d);
            border-color: #38ef7d;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(56,239,125,0.4);
        }

        .hari-nomor {
            font-size: 16px;
            margin-bottom: 2px;
        }

        .hari-gaji {
            font-size: 10px;
            opacity: 0.9;
        }

        .total-section {
            background: linear-gradient(135deg, #ff6b6b, #feca57);
            padding: 25px;
            text-align: center;
            margin: 0 25px 25px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }

        .total-gaji {
            font-size: 42px;
            font-weight: bold;
            margin: 10px 0;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.4);
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            padding: 0 25px 25px;
        }

        .btn {
            flex: 1;
            padding: 18px;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        
        .hari-tanggal.luar-bulan{
            opacity:.35;
            pointer-events:none;
        }


        @media (max-width: 480px) {
            .bulan-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .kalender-modal {
                margin: 20px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 12 Bulan + Kalender</h1>
            <p>Tap bulan → Kalender → Tap hari = +Rp50K</p>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-number" id="totalHariGlobal">0</span>
                    <span class="stat-label">Total Hari</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="totalGajiGlobal">Rp0</span>
                    <span class="stat-label">Tahun Ini</span>
                </div>
            </div>
        </div>

        <div class="bulan-grid" id="bulanGrid"></div>

        <div class="total-section">
            <div class="total-hari" id="totalHariDisplay">0 hari kerja</div>
            <div class="total-gaji" id="totalGajiDisplay">Rp0</div>
        </div>

        <div class="action-buttons">
            <button class="btn" id="resetAll" style="background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%); color: white;">🔥 Reset Semua</button>
            <button class="btn" id="exportData" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">☁️ Sync Sheet</button>
        </div>
    </div>

    <!-- KALENDER MODAL -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="kalender-modal">
            <button class="modal-close" id="modalClose">×</button>
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">Loading...</div>
                <div style="font-size: 18px; opacity: 0.9;" id="modalStats">0 hari • Rp0</div>
            </div>
            <div class="kalender-grid" id="kalenderGrid">
                <!-- Kalender akan dirender di sini -->
            </div>
        </div>
    </div>

    <script>

        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby6eegl8Np6PIoB0DnNv54V-miRJYa7WaeOeKm3WkTruff3VVr_M6PTh7hfDcHegeE/exec";

        class Gaji12BulanKalender {
            constructor() {
                this.gajiKerja = 50000;
                this.gajiLibur = 75000;
                this.hariLibur = []; // Akan diisi otomatis dari API
                this.tahunSekarang = new Date().getFullYear();
                this.dataAbsen = JSON.parse(localStorage.getItem(`absen_${this.tahunSekarang}`)) || {};
                this.bulanAktif = null;
                this.init();
            }

            async init() {
                await this.loadHariLibur();
                this.renderBulan();
                this.bindEvents();
                this.updateDisplay();
            }

            bindEvents() {
                document.getElementById('resetAll').addEventListener('click', () => this.resetAll());
                document.getElementById('exportData').addEventListener('click', () => this.exportData());
                document.getElementById('modalClose').addEventListener('click', () => this.tutupModal());
                document.getElementById('modalOverlay').addEventListener('click', (e) => {
                    if (e.target === e.currentTarget) this.tutupModal();
                });
            }

            renderBulan() {
                const grid = document.getElementById('bulanGrid');
                const namaBulan = [
                    'Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun',
                    'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'
                ];

                grid.innerHTML = '';
                
                for (let i = 0; i < 12; i++) {
                    const absenBulan = this.dataAbsen[i] || {};
                    const hari = Object.keys(absenBulan).length;
                    const gaji = Object.values(absenBulan).reduce((s,v)=>s+(typeof v==="object"?v.nominal:this.gajiKerja),0);
                    
                    const card = document.createElement('div');
                    card.className = 'bulan-card';
                    card.innerHTML = `
                        <div class="nama-bulan">${namaBulan[i]}</div>
                        <div class="hari-display">${hari}</div>
                        <div class="gaji-display">${this.formatRupiah(gaji)}</div>
                    `;
                    card.addEventListener('click', () => this.bukaKalender(i));
                    grid.appendChild(card);
                }
            }

            bukaKalender(bulanIndex) {
                this.bulanAktif = bulanIndex;
                document.getElementById('modalOverlay').classList.add('show');
                this.renderKalenderModal();
            }

            tutupModal() {
                document.getElementById('modalOverlay').classList.remove('show');
                this.bulanAktif = null;
            }

            renderKalenderModal() {
                const namaBulan = [
                    'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
                    'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
                ];

                const title = document.getElementById('modalTitle');
                const stats = document.getElementById('modalStats');
                const grid = document.getElementById('kalenderGrid');

                title.textContent = `${namaBulan[this.bulanAktif]} ${this.tahunSekarang}`;
                
                const absenBulan = this.dataAbsen[this.bulanAktif] || {};
                const hariKerja = Object.keys(absenBulan).length;
                const totalBulan = Object.values(absenBulan).reduce((s,v)=>s+(typeof v==="object"?v.nominal:this.gajiKerja),0);
                stats.textContent = `${hariKerja} hari • ${this.formatRupiah(totalBulan)}`;

                // Header hari
                const hari = ['M', 'S', 'S', 'R', 'K', 'J', 'S'];
                grid.innerHTML = hari.map(h => `<div class="hari-nama">${h}</div>`).join('');

                // Kalender
                const firstDay = new Date(this.tahunSekarang, this.bulanAktif, 1);
                const lastDay = new Date(this.tahunSekarang, this.bulanAktif + 1, 0);
                const startDate = new Date(firstDay);
                startDate.setDate(startDate.getDate() - firstDay.getDay());

                for (let i = 0; i < 42; i++) {
                    const date = new Date(startDate);
                    date.setDate(startDate.getDate() + i);
                    
                    const tanggalStr = date.getDate().toString().padStart(2, '0');
                    const key = `${tanggalStr}-${date.getMonth()}-${date.getFullYear()}`;
                    const sudahKerja = !!absenBulan[key];
                    const luarBulan = date.getMonth() !== this.bulanAktif;
                    
                    const hariEl = document.createElement('div');
                    hariEl.className = `hari-tanggal ${sudahKerja ? 'kerja' : ''} ${luarBulan ? 'luar-bulan' : ''}`;
                    const nominal = this.getNominal(date);
                    const labelNominal = nominal === this.gajiLibur ? '+Rp75K' : '+Rp50K';
                    hariEl.innerHTML = `
                        <div class="hari-nomor">${date.getDate()}</div>
                        <div class="hari-gaji">${sudahKerja ? labelNominal : (nominal === this.gajiLibur ? '75K' : '50K')}</div>
                    `;
                    hariEl.addEventListener('click', () => this.toggleHari(key));
                    grid.appendChild(hariEl);
                }
            }

            toggleHari(tanggalKey) {
                if (!this.dataAbsen[this.bulanAktif]) {
                    this.dataAbsen[this.bulanAktif] = {};
                }
                
                if (this.dataAbsen[this.bulanAktif][tanggalKey]) {
                    delete this.dataAbsen[this.bulanAktif][tanggalKey];
                    if (Object.keys(this.dataAbsen[this.bulanAktif]).length === 0) {
                        delete this.dataAbsen[this.bulanAktif];
                    }
                } else {
                    const p = tanggalKey.split("-");
                    const d = new Date(parseInt(p[2]), parseInt(p[1]), parseInt(p[0]));
                    const nominal = this.getNominal(d);
                    this.dataAbsen[this.bulanAktif][tanggalKey] = {
                        kerja:true,
                        nominal:nominal
                    };

                    this.kirimKeSheets({
                        tanggal:d.toLocaleDateString("id-ID"),
                        hari:d.toLocaleDateString("id-ID",{weekday:"long"}),
                        jenis: nominal===this.gajiLibur ? "Libur/Weekend" : "Hari Kerja",
                        nominal:nominal
                    });
                }
                
                localStorage.setItem(`absen_${this.tahunSekarang}`, JSON.stringify(this.dataAbsen));
                this.renderKalenderModal();
                this.renderBulan();
                this.updateDisplay();
            }


            async loadHariLibur() {
                try {
                    const res = await fetch(`https://api-harilibur.vercel.app/api?year=${this.tahunSekarang}`);
                    if (!res.ok) return;
                    const data = await res.json();
                    this.hariLibur = data.map(x => x.holiday_date || x.tanggal).filter(Boolean);
                } catch(e){
                    console.warn("Gagal memuat hari libur.", e);
                }
            }

            getNominal(date){
                const iso = date.toISOString().split("T")[0];
                const weekend = date.getDay() === 0 || date.getDay() === 6;
                const nasional = this.hariLibur.includes(iso);
                return (weekend || nasional) ? this.gajiLibur : this.gajiKerja;
            }


            async kirimKeSheets(data){
                try{
                    await fetch(WEB_APP_URL,{
                        method:"POST",
                        headers:{
                            "Content-Type":"application/json"
                        },
                        body:JSON.stringify(data)
                    });
                }catch(err){
                    console.error("Gagal kirim ke Google Sheets",err);
                }
            }

            updateDisplay() {
                const totalHari = Object.values(this.dataAbsen).reduce((acc, bulan) => 
                    acc + Object.keys(bulan || {}).length, 0);
                const totalGaji = Object.values(this.dataAbsen).reduce((sum, bulan) => {
                    return sum + Object.entries(bulan || {}).reduce((s,[,v]) => s + (typeof v==="object" ? v.nominal : this.gajiKerja),0);
                },0);
                
                document.getElementById('totalHariGlobal').textContent = totalHari;
                document.getElementById('totalGajiGlobal').textContent = this.formatRupiah(totalGaji);
                document.getElementById('totalHariDisplay').textContent = `${totalHari} hari kerja`;
                document.getElementById('totalGajiDisplay').textContent = this.formatRupiah(totalGaji);
            }

            formatRupiah(angka) {
                return new Intl.NumberFormat('id-ID', {
                    style: 'currency',
                    currency: 'IDR',
                    minimumFractionDigits: 0
                }).format(angka);
            }

            resetAll() {
                if (confirm('Reset SEMUA absen tahun ini?')) {
                    localStorage.removeItem(`absen_${this.tahunSekarang}`);
                    this.dataAbsen = {};
                    this.renderBulan();
                    this.updateDisplay();
                }
            }

            async exportData() {
                const semua = [];

                Object.entries(this.dataAbsen).forEach(([bulan, dataBulan]) => {
                    Object.entries(dataBulan || {}).forEach(([key, value]) => {
                        const p = key.split("-");
                        const d = new Date(parseInt(p[2]), parseInt(p[1]), parseInt(p[0]));
                        semua.push({
                            tanggal: d.toLocaleDateString("id-ID"),
                            hari: d.toLocaleDateString("id-ID",{weekday:"long"}),
                            jenis: (value.nominal===this.gajiLibur) ? "Libur/Weekend" : "Hari Kerja",
                            nominal: value.nominal
                        });
                    });
                });

                if(semua.length===0){
                    alert("Belum ada data untuk disinkronkan.");
                    return;
                }

                try{
                    for(const item of semua){
                        await this.kirimKeSheets(item);
                    }
                    alert("✅ Sinkronisasi ke Google Sheets berhasil!");
                }catch(e){
                    alert("❌ Sinkronisasi gagal.");
                    console.error(e);
                }
            }
        }

        const app = new Gaji12BulanKalender();
    </script>
</body>
</html>
